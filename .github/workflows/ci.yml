name: Mi Pipeline DevOps

on: [push]

jobs:
  construir-y-desplegar:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Iniciar sesion en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir la imagen de Docker
      run: docker build . -t juan25ruiz/mi-proyecto-devops:latest

    - name: Subir la imagen a Docker Hub
      run: docker push juan25ruiz/mi-proyecto-devops:latest

    - name: Desplegar en Google Cloud (CD)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_VM_IP }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        script: |
          sudo docker pull juan25ruiz/mi-proyecto-devops:latest
          sudo docker stop mi-web || true
          sudo docker rm mi-web || true
          sudo docker run -d --name mi-web -p 80:3000 juan25ruiz/mi-proyecto-devops:latest
