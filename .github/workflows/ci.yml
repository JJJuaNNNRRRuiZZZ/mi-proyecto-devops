name: Mi Pipeline DevOps

on: [push]

jobs:
  construir-y-subir:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Iniciar sesion en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir la imagen de Docker
      run: docker build . -t juan25ruiz/mi-proyecto-devops:latest

    - name: Subir la imagen a Docker Hub
      run: docker push juan25ruiz/mi-proyecto-devops:latest
